services:
  postgres:
    image: postgres:17-alpine
    container_name: devdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdocs
      POSTGRES_PASSWORD: devdocs
      POSTGRES_DB: devdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdocs -d devdocs"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: